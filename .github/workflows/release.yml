name: Build And Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build_pure_wheel:
    name: Build pure wheel
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build pure wheel
        env:
          CASPERFPGA_BUILD_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          CASPERFPGA_BUILD_PROGSKA: "0"
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip wheel . --wheel-dir wheelhouse --no-deps

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-pure
          path: wheelhouse/*.whl

  build_progska_wheels:
    name: Build progska wheel on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-13
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build progska wheel
        env:
          CASPERFPGA_BUILD_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip wheel ./packaging/progska --wheel-dir wheelhouse --no-deps

      - name: Upload progska wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-progska-${{ matrix.os }}
          path: wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install build frontend
        run: python -m pip install --upgrade build

      - name: Build sdist
        env:
          CASPERFPGA_BUILD_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: python -m build --sdist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  build_offline_bundle:
    name: Build offline bundle
    needs:
      - build_pure_wheel
      - build_progska_wheels
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: offline-artifacts
          merge-multiple: true

      - name: Download tftpy wheel
        run: |
          mkdir -p offline-artifacts
          curl -L \
            https://github.com/pHantomU94/tftpy/releases/download/v0.8.7.post1/tftpy-0.8.7.post1-py3-none-any.whl \
            -o offline-artifacts/tftpy-0.8.7.post1-py3-none-any.whl

      - name: Assemble offline bundle
        env:
          RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
        run: |
          bundle_root="casperfpga-offline-${RELEASE_VERSION}"
          mkdir -p "${bundle_root}/wheelhouse"
          cp offline-artifacts/*.whl "${bundle_root}/wheelhouse/"
          cp packaging/offline/install_offline.sh "${bundle_root}/"
          cp packaging/offline/README-offline.md "${bundle_root}/"
          chmod +x "${bundle_root}/install_offline.sh"
          tar -czf "${bundle_root}.tar.gz" "${bundle_root}"

      - name: Upload offline bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: offline-bundle
          path: casperfpga-offline-*.tar.gz

  release:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs:
      - build_pure_wheel
      - build_progska_wheels
      - build_sdist
      - build_offline_bundle
    runs-on: ubuntu-latest
    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Download sdist artifact
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Download offline bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: offline-bundle
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
