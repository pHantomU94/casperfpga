name: Build And Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-13
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21.3
        env:
          CASPERFPGA_BUILD_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  build_windows_wheel:
    name: Build wheel on windows-latest
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build Windows wheel
        env:
          CASPERFPGA_BUILD_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          CASPERFPGA_BUILD_PROGSKA: "0"
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip wheel . --wheel-dir wheelhouse --no-deps

      - name: Upload Windows wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-latest
          path: wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install build frontend
        run: python -m pip install --upgrade build

      - name: Build sdist
        env:
          CASPERFPGA_BUILD_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: python -m build --sdist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  release:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs:
      - build_wheels
      - build_windows_wheel
      - build_sdist
    runs-on: ubuntu-latest
    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Download sdist artifact
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
